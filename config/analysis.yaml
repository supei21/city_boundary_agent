project:
  name: 城镇开发边界地块识别智能体Demo
  version: demo-1.1.0

workflow:
  max_retries: 2
  require_human_approval: true

thresholds:
  primary_inclusion: 80
  secondary_inclusion: 65
  exclusion: 40
  minimum_completeness: 0.60
  minimum_confidence: 0.60

weights:
  traffic: 0.25
  terrain: 0.10
  infrastructure: 0.20
  urban_form: 0.10
  industry: 0.25
  population: 0.05
  landuse: 0.05

dynamic_adaptation:
  # Di = alpha*Pi + beta*Si + gamma*Ri - delta*Ci
  weights:
    development_probability: 0.30
    suitability: 0.40
    planning_match: 0.30
    constraint_penalty: 0.15
  planning_neutral_score: 50
  district_candidate_percentile: 0.20

development_hotspot:
  # 边界外按分位数选调入热点；边界内dev_score低于0.40时进入调出候选。
  primary_percentile: 0.95
  secondary_percentile: 0.80
  exclusion_max_score: 0.40

trained_model:
  enabled: true
  model_dir: "models"
  min_feature_coverage: 0.50
  probability_field: development_probability
  note: 数据包有 dev_score 时直接使用；没有时读取项目内 XGBoost 模型生成开发概率。

scales:
  road_density_high: 8.0
  transport_poi_high: 20
  public_poi_high: 30
  industry_poi_high: 35
  commercial_poi_high: 25
  population_density_high: 10000
  relief_high: 50

hard_constraints:
  ecological_redline: true
  permanent_farmland: true
  prohibited_disaster_zone: true

policy_rag:
  enabled: true
  policy_dir: "D:\\downloadzhuomian\\Codex城镇开发边界智能体\\rag1.0\\rag1.0\\城镇边界政策库"
  rules_path: "D:\\downloadzhuomian\\Codex城镇开发边界智能体\\rag1.0\\rag1.0\\城镇边界政策库\\policy_rules.json"
  index_path: "runtime/policy_rag/policy_index.json"
  retrieval_k: 6
  chunk_size: 900
  chunk_overlap: 120

output:
  language: zh-CN
  save_audit_log: true
